1. В блоке **Джерело** (Source) нажмите на синюю кнопку **Розгортання з гілки** (Deploy from a branch).
2. В появившемся меню выберите **GitHub Actions**.
3. После этого ниже появится список шаблонов. Найдите **Static HTML** (или **Node.js**) и нажмите кнопку **Configure**.
4. Полностью замените содержимое предложенного файла на следующий код (он заходит в нужную папку `artifacts/water-traffic`, собирает проект и публикует его):

```yaml
name: Deploy to GitHub Pages

on:
  push:
    branches: ["головний"] # или "main" / "master", если ваша ветка называется иначе

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          cd artifacts/water-traffic
          npm install
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'artifacts/water-traffic/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
